name: LaunchTwin CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Single Alembic Head
        run: |
          HEAD_COUNT=$(python -m alembic heads | wc -l)
          echo "Discovered $HEAD_COUNT Alembic head(s)"
          python -m alembic heads
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "Error: Expected exactly ONE alembic head, found $HEAD_COUNT"
            exit 1
          fi

      - name: Run Test Suite (SQLite)
        run: python -m pytest -q

  backend-postgres:
    name: Backend (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchtwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/launchtwin_test
        run: python -m alembic upgrade head

      - name: Run Full Pytest Suite (PostgreSQL Gated)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/launchtwin_test
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/launchtwin_test
        run: python -m pytest -q

  contract:
    name: API Contract Drift Lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export OpenAPI and Verify Zero Contract Drift
        run: |
          python scripts/export_openapi.py
          git diff --exit-code contracts/

      - name: Run Contract Lock Tests
        run: python -m pytest tests/contract/test_no_route_removed.py -q

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Production Bundle
        run: npm run build

  landing:
    name: Landing Page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
