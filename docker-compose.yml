version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: launchtwin_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: launchtwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d launchtwin"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: launchtwin_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/launchtwin
      RESEARCH_PROVIDER: mock
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    command: >
      sh -c "alembic upgrade head && python scripts/seed.py && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
